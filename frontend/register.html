<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — Vivek college of commerce Institute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">Vivek college of commerce Institute</div>
    <h1>Create Account</h1>
    <p class="sub">Register to save your enquiry history and track applications.</p>

    <form id="registerForm">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Your name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <button type="submit" class="btn-submit">Register</button>
      <div class="form-msg" id="formMsg"></div>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
    <a class="back-home" href="index.html">← Back to Home</a>
  </div>

  <script src="assets/js/login.js"></script>
</body>
</html>
